<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>OWN.CAR — Client Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,700;0,800;1,800&family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap');
  :root{
    --bg:#050505;--bg2:#0A0A0A;--surface:#101012;--surface2:#17171A;--surface3:#202024;
    --line:#1B1B1B;--line2:#2A2A2A;
    --text:#F2F2EE;--muted:#9A9A94;--muted2:#6B6B65;
    --accent:#E0BC4A;--accent-2:#EFD37C;--accent-soft:rgba(224,188,74,0.13);
    --green:#43B581;--green-soft:rgba(67,181,129,0.16);--red-soft:rgba(225,73,73,0.15);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;font-family:'Hanken Grotesk',system-ui,sans-serif;}
  .mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;}
  .arch{font-family:'Archivo',sans-serif;}
  .msym{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;display:inline-block;-webkit-font-smoothing:antialiased;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{background:var(--bg);color:var(--text);display:flex;justify-content:center;touch-action:manipulation;}
  #app{width:100%;max-width:460px;height:100%;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;background:
      radial-gradient(620px 320px at 100% -4%,rgba(224,188,74,0.10),rgba(0,0,0,0) 60%),var(--bg2);
    position:relative;display:flex;flex-direction:column;padding-bottom:28px;}
  .center{text-align:center;} .muted{color:var(--muted);}
  button{cursor:pointer;font-family:inherit;color:inherit;}
  a{color:var(--accent);text-decoration:none;}
  svg{display:block;}

  .glabel{font-family:'Hanken Grotesk',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
  .glabel.mut{color:var(--muted2);}
  .disp{font-weight:800;letter-spacing:-.6px;}

  .btn{width:100%;height:56px;border:none;border-radius:18px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary{background:linear-gradient(180deg,var(--accent-2),#C79E22);color:#120E04;font-weight:700;box-shadow:0 12px 28px -8px rgba(224,188,74,.42);}
  .btn-ghost{background:rgba(255,255,255,0.05);color:var(--text);border:1px solid var(--line2);font-weight:500;}
  input,select{width:100%;height:52px;background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--text);font-size:15px;padding:0 15px;outline:none;}
  input:focus,select:focus{border-color:var(--accent);}
  input[type=date]{color-scheme:dark;padding:0 12px;} input[type=date]::-webkit-calendar-picker-indicator{filter:invert(76%) sepia(38%) saturate(560%) hue-rotate(1deg);cursor:pointer;}
  textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--text);font-size:15px;padding:12px 15px;outline:none;resize:vertical;font-family:inherit;}
  textarea:focus{border-color:var(--accent);}
  label{font-size:11px;color:var(--muted);letter-spacing:.4px;display:block;margin:0 2px 8px;font-family:'Hanken Grotesk',sans-serif;text-transform:uppercase;}

  /* top bar (home) + sub header */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 6px;position:sticky;top:0;z-index:20;background:var(--bg2);}
  .tb-right{display:flex;align-items:center;gap:12px;}
  .iconbtn{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;}
  .iconbtn svg{width:19px;height:19px;}
  .iconbtn .dot{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .avatar{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#0B0B0C;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border:none;}
  .subhead{display:flex;align-items:center;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 8px;position:sticky;top:0;z-index:20;background:var(--bg2);}
  .backbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;}
  .htitle{font-size:19px;font-weight:700;letter-spacing:-.3px;}
  /* back-to-app (returns to the V4 shop) */
  .backapp{display:inline-flex;align-items:center;gap:2px;height:38px;padding:0 13px 0 7px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:12px;font-weight:600;letter-spacing:.2px;}
  .backapp .msym{font-size:19px;color:var(--accent);}
  .backapp:active{border-color:var(--accent);background:var(--surface2);}

  .body{flex:1;padding:8px 20px 22px;}
  .greet-h{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:2px;}
  .sec-h{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;position:relative;overflow:hidden;}
  .card + .card{margin-top:16px;}

  /* contract card */
  .contract{background:radial-gradient(420px 200px at 115% -30%,rgba(224,188,74,0.14),rgba(224,188,74,0) 62%),var(--surface);}
  .crow{display:flex;gap:15px;align-items:center;margin-bottom:20px;}
  .cimg{width:74px;height:74px;border-radius:15px;flex:0 0 auto;border:1px solid var(--line2);
     background:repeating-linear-gradient(135deg,#25252b,#25252b 7px,#1c1c21 7px,#1c1c21 14px);}
  .cname{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:5px;}
  .csub{font-size:13px;color:var(--muted);margin-top:1px;}
  .prog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .pct{font-family:'Hanken Grotesk',sans-serif;font-size:12px;color:var(--accent);font-weight:600;}
  .track{height:7px;border-radius:6px;background:var(--surface3);overflow:hidden;}
  .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
  .prow{display:flex;justify-content:space-between;margin-top:12px;font-family:'Hanken Grotesk',sans-serif;font-size:10px;letter-spacing:1px;color:var(--muted2);}
  .prow .mid{color:var(--muted);}

  /* next payment card */
  .pay{border-color:rgba(224,188,74,0.28);background:radial-gradient(380px 200px at 110% -30%,rgba(224,188,74,0.16),rgba(224,188,74,0) 60%),linear-gradient(160deg,#1a1712,#141416);}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;}
  .cardicon{width:46px;height:46px;border-radius:13px;background:var(--accent);color:#0B0B0C;display:flex;align-items:center;justify-content:center;}
  .cardicon svg{width:22px;height:22px;}
  .pamt{font-size:40px;font-weight:800;letter-spacing:-1.5px;margin-top:14px;}
  .pamt .cur{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0;margin-right:7px;vertical-align:7px;}
  .pdue{font-size:14px;color:var(--muted);margin:8px 0 18px;} .pdue b{color:var(--text);font-weight:600;}

  /* quick actions — two wide cards (Statement / Help) */
  .qa2{display:flex;flex-direction:column;gap:12px;margin-top:20px;}
  .qcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;color:inherit;transition:border-color .15s,background .15s;}
  .qcard:active{border-color:var(--accent);background:var(--surface2);}
  .qc-ic{width:46px;height:46px;border-radius:13px;flex:0 0 auto;background:var(--accent-soft);border:1px solid rgba(224,188,74,0.25);display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .qc-ic svg{width:22px;height:22px;}
  .qc-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .qc-t{font-size:16px;font-weight:700;letter-spacing:-.3px;}
  .qc-s{font-size:12.5px;color:var(--muted);}
  .qc-ch{color:var(--muted2);font-size:20px;flex:0 0 auto;}

  /* account hub — grid of entry cards */
  .hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .hubcard{display:flex;flex-direction:column;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;color:inherit;transition:border-color .15s,background .15s;}
  .hubcard:active{border-color:var(--accent);background:var(--surface2);}
  .hub-ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);border:1px solid rgba(224,188,74,0.22);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px;}
  .hub-t{font-size:15.5px;font-weight:700;letter-spacing:-.2px;}
  .hub-s{font-size:12px;color:var(--muted);margin-top:2px;}
  .notifrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 16px;margin-top:12px;color:inherit;}
  .notifrow:active{border-color:var(--accent);background:var(--surface2);}
  .notifrow .hub-ic{margin-bottom:0;flex:0 0 auto;}
  .notifrow .nr-m{flex:1;min-width:0;}
  .notifrow .nr-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto;}

  /* payment page */
  .paysum{border-radius:20px;padding:20px;margin-bottom:18px;background:radial-gradient(320px 150px at 110% -30%,rgba(224,188,74,0.16),rgba(224,188,74,0) 60%),linear-gradient(160deg,#1a1712,#141416);border:1px solid rgba(224,188,74,0.28);}
  .paysum .sv{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:6px;}
  .amtbox{position:relative;}
  .amtbox .cur{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;font-size:15px;pointer-events:none;}
  .amtbox input{padding-left:52px;font-size:18px;font-weight:700;}
  .remain{font-size:12.5px;color:var(--muted);margin:8px 2px 20px;}
  .remain b{color:var(--text);}
  .paymethods{display:flex;flex-direction:column;gap:11px;margin-bottom:6px;}
  .pm{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;color:inherit;transition:border-color .15s,background .15s;}
  .pm .msym{font-size:24px;color:var(--accent);flex:0 0 auto;}
  .pm .pm-m{flex:1;display:flex;flex-direction:column;} .pm-t{font-size:15px;font-weight:700;} .pm-s{font-size:12px;color:var(--muted);margin-top:2px;}
  .pm .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .pm.on{border-color:var(--accent);background:var(--accent-soft);} .pm.on .chk{border-color:var(--accent);background:var(--accent);}
  .pm.on .chk .msym{font-size:15px;color:#120E04;}
  .pm.disabled{opacity:.5;} .pm.disabled .msym{color:var(--muted);}
  .bankbox{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;margin:14px 0;}
  .bankrow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
  .bankrow:last-child{border-bottom:none;} .bankrow .k{color:var(--muted);} .bankrow .v{font-weight:600;text-align:right;word-break:break-all;}
  .copyv{background:none;border:none;color:var(--text);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:0;justify-content:flex-end;cursor:pointer;}
  .copyv .msym{font-size:15px;color:var(--accent);flex:0 0 auto;}
  .copyv:active{color:var(--accent);}
  .uploadtile{display:block;border:1.5px dashed var(--line2);border-radius:15px;background:var(--surface);cursor:pointer;overflow:hidden;margin-bottom:18px;}
  .uploadtile input{display:none;}
  .utinner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;width:100%;min-height:150px;padding:16px;}
  .utinner .msym{font-size:30px;color:var(--accent);} .utinner .ut-t{font-size:13px;color:var(--muted);text-align:center;}
  .utinner img{width:100%;max-height:280px;object-fit:contain;border-radius:8px;}
  .notehint{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 12px;line-height:1.5;}
  .notehint .msym{font-size:17px;color:var(--accent);flex:0 0 auto;margin-top:1px;}
  .notehint b{color:var(--text);font-weight:600;}

  /* timeline */
  .tl-row{display:flex;align-items:center;gap:14px;padding:13px 14px;border:1px solid var(--line);border-radius:16px;margin-bottom:11px;background:var(--surface);}
  .tl-row.due{border-color:rgba(224,188,74,0.5);background:linear-gradient(160deg,#1b1811,#151517);}
  .tl-ic{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:14px;}
  .tl-ic.paid{background:var(--green);color:#06231a;} .tl-ic.paid svg{width:22px;height:22px;stroke:#06231a;}
  .tl-ic.due{background:var(--accent);color:#0B0B0C;} .tl-ic.due svg{width:22px;height:22px;stroke:#0B0B0C;}
  .tl-ic.sched{background:var(--surface3);color:var(--muted);border:1px solid var(--line);}
  .tl-m{flex:1;} .tl-t{font-size:15px;font-weight:700;letter-spacing:-.2px;}
  .tl-s{margin-top:3px;}
  .tl-amt{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;}
  .tl-row.due .tl-amt{color:var(--text);}

  /* generic rows (invoices / receipts) */
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:4px;margin:2px 0 18px;}
  .seg button{flex:1;background:none;border:none;color:var(--muted);font-size:13px;padding:9px 0;border-radius:9px;font-weight:500;}
  .seg button.on{background:var(--surface3);color:var(--text);}
  .row{display:flex;align-items:center;gap:13px;padding:14px 15px;border:1px solid var(--line);border-radius:15px;margin-bottom:11px;background:var(--surface);}
  .row .ic{width:42px;height:42px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--accent);}
  .row .ic svg{width:19px;height:19px;} .row .m{flex:1;min-width:0;} .row .r{text-align:right;}
  .r1{font-size:14px;font-weight:600;} .r2{font-size:11px;color:var(--muted);margin-top:3px;}
  .carpick{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid var(--line);border-radius:15px;margin-bottom:10px;background:var(--surface);width:100%;text-align:left;color:inherit;cursor:pointer;font:inherit;transition:border-color .15s,background .15s;}
  .carpick .ic{width:42px;height:42px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--accent);}
  .carpick .ic svg{width:19px;height:19px;} .carpick .m{flex:1;min-width:0;}
  .carpick .chev{color:var(--muted);font-size:18px;flex:0 0 auto;}
  .carpick:active{background:var(--surface2);}
  .carpick.on{border-color:var(--accent);} .carpick.on .chev{color:var(--accent);font-weight:700;}
  .amt2{font-size:15px;font-weight:700;}
  .pill{display:inline-block;font-family:'Hanken Grotesk',sans-serif;font-size:9px;letter-spacing:1px;font-weight:600;padding:3px 8px;border-radius:7px;margin-top:5px;text-transform:uppercase;}
  .pill.paid{background:var(--green-soft);color:#7fe0b4;} .pill.due{background:var(--accent-soft);color:var(--accent-2);} .pill.overdue,.pill.unpaid{background:var(--red-soft);color:#ff8a97;}
  .row.tap{cursor:pointer;transition:.15s;} .row.tap:active{border-color:var(--accent);background:var(--surface2);}
  .dl{display:inline-flex;align-items:center;gap:3px;font-family:'Hanken Grotesk',sans-serif;font-size:9px;color:var(--accent);font-weight:600;letter-spacing:.5px;margin-left:7px;border:1px solid rgba(224,188,74,0.4);padding:2px 6px;border-radius:7px;vertical-align:middle;white-space:nowrap;}

  .summary{border-radius:20px;padding:20px;margin-bottom:16px;background:radial-gradient(320px 150px at 110% -30%,rgba(224,188,74,0.16),rgba(224,188,74,0) 60%),linear-gradient(160deg,#1a1712,#141416);border:1px solid rgba(224,188,74,0.28);}
  .summary .sv{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin-top:6px;}
  .summary .sv.due{color:#ffb4b4;} .summary .sv.ok{color:#7fe0b4;}
  .stmt-period{font-size:11.5px;color:var(--muted);margin-top:8px;}
  .stmt-grid{display:grid;gap:10px;margin-top:16px;}
  .stmt-grid.g2{grid-template-columns:1fr 1fr;} .stmt-grid.g3{grid-template-columns:1fr 1fr 1fr;}
  .stmt-cell{background:rgba(0,0,0,0.24);border:1px solid var(--line);border-radius:12px;padding:10px 11px;}
  .stmt-cell .k{font-family:'Hanken Grotesk',sans-serif;font-size:8.5px;letter-spacing:1px;color:var(--muted2);text-transform:uppercase;}
  .stmt-cell .v{font-size:14.5px;font-weight:700;margin-top:5px;letter-spacing:-.3px;}
  .stmt-cell .v.g{color:var(--green);}
  .ledger .row{margin-bottom:10px;}
  /* From / Till date fields — whole card is tappable, opens the native picker */
  .drange{display:flex;gap:10px;margin:2px 0 8px;}
  .datefield{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;transition:border-color .15s,background .15s;overflow:hidden;}
  .datefield:active{border-color:var(--accent);}
  .datefield.set{border-color:rgba(224,188,74,0.42);background:var(--accent-soft);}
  .df-top{display:flex;align-items:center;gap:6px;}
  .df-top svg{width:13px;height:13px;color:var(--accent);}
  .df-lab{font-family:'Hanken Grotesk',sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);}
  .df-val{font-size:16px;font-weight:700;margin-top:6px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .df-val.empty{color:var(--muted2);font-weight:500;}
  /* the real date input sits transparent ON TOP so a tap opens the native
     picker directly (works on iOS/Android); the card text shows through it */
  .datefield .df-top,.datefield .df-val{pointer-events:none;}
  .datefield input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;margin:0;padding:0;background:transparent;cursor:pointer;font-size:16px;}

  /* booking */
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px;}
  .chip{font-size:12.5px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted);}
  .chip.on{background:var(--accent-soft);border-color:rgba(224,188,74,0.4);color:#e8cf7f;font-weight:600;}
  .times{display:flex;gap:10px;margin-bottom:8px;}
  .tcell{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 0;text-align:center;background:var(--surface);color:var(--muted);font-size:13px;}
  .tcell.on{background:var(--accent-soft);border-color:var(--accent);color:#e8cf7f;}
  .tcell.disabled{opacity:.3;text-decoration:line-through;pointer-events:none;}

  /* bottom nav — V4 tab-bar style */
  .nav{position:fixed;bottom:0;width:100%;max-width:460px;height:calc(96px + env(safe-area-inset-bottom,0px));background:#0A0A0A;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);align-items:start;padding-top:14px;box-sizing:border-box;z-index:100;}
  .nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px;color:#6B6B65;font-family:'Hanken Grotesk',sans-serif;font-size:8px;letter-spacing:0.14em;text-transform:uppercase;}
  .nav .navic{display:flex;align-items:center;justify-content:center;}
  .nav .navic .msym{font-size:23px;color:#6B6B65;transition:color .15s;}
  .nav button.on{color:var(--accent);}
  .nav button.on .navic .msym{color:var(--accent);}

function ensureGload(){
  if(!window._glInit){ window._glInit=1; window._glN=0;
    var s=document.createElement('style'); s.textContent='.gload{position:fixed;inset:0;background:rgba(5,5,5,.55);display:none;align-items:center;justify-content:center;z-index:400}.gload.show{display:flex}.gspin{width:42px;height:42px;border:3px solid rgba(255,255,255,.22);border-top-color:#E0BC4A;border-radius:50%;animation:gspin .7s linear infinite}@keyframes gspin{to{transform:rotate(360deg)}}'; document.head.appendChild(s);
    var g=document.createElement('div'); g.className='gload'; g.id='gload'; g.innerHTML='<div class="gspin"></div>'; document.body.appendChild(g);
  }
  return document.getElementById('gload');
}
async function api(path, opts){
  var g=ensureGload(); window._glN++; if(g) g.classList.add('show');
  try{ const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts}); const d=await r.json().catch(()=>({})); if(!r.ok) throw d; return d; }
  finally{ window._glN--; if(g && window._glN<=0) g.classList.remove('show'); }
}
function downloadFile(url, filename){
  var ua=navigator.userAgent||'';
  var isAndroid=/Android/i.test(ua);
  var isIOS=/iPhone|iPad|iPod/i.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

  // iOS (Safari + in-app WebView): opening the PDF URL in a new tab shows the built-in
  // PDF viewer reliably. Must run synchronously in the tap to avoid popup blocking.
  if(isIOS){
    var w=window.open(url,'_blank');
    if(!w){ location.href=url; }   // popup blocked -> open in place (Back returns to the app)
    return;
  }

  // Android: the packaged app runs in a WebView that CANNOT render PDFs inline and blocks
  // window.open — which is why it used to download. Instead, render the PDF right inside the
  // app with pdf.js. (A "Save" button in the viewer still offers download/share as before.)
  if(isAndroid){
    viewPdfInApp(url, filename||'document.pdf');
    return;
  }

  // Desktop: silent blob download.
  (async()=>{
    var g=ensureGload(); window._glN++; if(g) g.classList.add('show');
    try{
      const r=await fetch(url,{headers:{'Accept':'application/pdf'}});
      if(!r.ok){ let m='Could not download file.'; try{ const j=await r.json(); m=j.error||m; }catch(e){} toast(m); return; }
      const blob=await r.blob(); const a=document.createElement('a'); const u=URL.createObjectURL(blob);
      a.href=u; a.download=filename||'document.pdf'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),5000); toast('Downloaded '+(filename||'file'));
    }catch(e){ toast('Could not download file.'); }
    finally{ window._glN--; if(g && window._glN<=0) g.classList.remove('show'); }
  })();
}
// ---- In-app PDF viewer (Android WebViews can't render PDFs natively; pdf.js draws them to canvas) ----
var _pdfjsPromise=null;
function ensurePdfJs(){
  if(_pdfjsPromise) return _pdfjsPromise;
  _pdfjsPromise=new Promise(function(res,rej){
    if(window.pdfjsLib){ res(window.pdfjsLib); return; }
    var s=document.createElement('script'); s.src='/vendor/pdfjs/pdf.min.js';
    s.onload=function(){ window.pdfjsLib ? res(window.pdfjsLib) : rej(new Error('pdfjs missing')); };
    s.onerror=function(){ _pdfjsPromise=null; rej(new Error('pdfjs load failed')); };
    document.head.appendChild(s);
  }).then(function(lib){ try{ lib.GlobalWorkerOptions.workerSrc='/vendor/pdfjs/pdf.worker.min.js'; }catch(e){} return lib; });
  return _pdfjsPromise;
}
function viewPdfInApp(url, title){
  var g=ensureGload(); window._glN++; if(g) g.classList.add('show');
  var done=function(){ window._glN--; if(g && window._glN<=0) g.classList.remove('show'); };
  ensurePdfJs().then(function(pdfjsLib){
    return fetch(url,{headers:{'Accept':'application/pdf'}}).then(function(r){
      if(!r.ok) throw new Error('http '+r.status);
      return r.arrayBuffer();
    }).then(function(buf){
      return pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    });
  }).then(function(pdf){
    done(); openPdfOverlay(pdf, title, url);
  }).catch(function(e){
    // Anything goes wrong (library, network, auth) -> fall back to the old save/share path.
    done(); androidSaveFile(url, title);
  });
}
function openPdfOverlay(pdf, title, url){
  var ov=$('<div class="pdf-ov"><div class="pdf-bar"><button class="pdf-btn pdf-x" aria-label="Close">&#10005;</button><div class="pdf-title"></div><button class="pdf-btn pdf-dl" aria-label="Save">Save</button></div><div class="pdf-scroll"></div></div>');
  ov.querySelector('.pdf-title').textContent=title||'Document';
  var scroll=ov.querySelector('.pdf-scroll');
  ov.querySelector('.pdf-x').onclick=function(){ ov.remove(); };
  ov.querySelector('.pdf-dl').onclick=function(){ androidSaveFile(url, title); };
  document.body.appendChild(ov);
  var dpr=Math.min(2, window.devicePixelRatio||1);
  var render=function(n){
    if(n>pdf.numPages) return;
    pdf.getPage(n).then(function(page){
      var cw=(scroll.clientWidth||window.innerWidth)-24; if(cw<200) cw=(window.innerWidth||360)-24;
      var base=page.getViewport({scale:1});
      var vp=page.getViewport({scale:(cw/base.width)*dpr});
      var cv=document.createElement('canvas'); cv.className='pdf-page';
      cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
      cv.style.width=cw+'px'; cv.style.height='auto';
      scroll.appendChild(cv);
      page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise.then(function(){ render(n+1); }, function(){ render(n+1); });
    }, function(){});
  };
  render(1);
}
// The original Android "get the PDF out of the app" path — now used for the viewer's Save button + as a fallback.
function androidSaveFile(url, filename){
  (async()=>{
    var g=ensureGload(); window._glN++; if(g) g.classList.add('show');
    var fname=filename||'document.pdf';
    try{
      const r=await fetch(url,{headers:{'Accept':'application/pdf'}});
      if(!r.ok){ let m='Could not open the file.'; try{ const j=await r.json(); m=j.error||m; }catch(e){} toast(m); return; }
      const blob=await r.blob();
      try{
        const file=new File([blob],fname,{type:'application/pdf'});
        if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:fname}); return; }
      }catch(e){ if(e && e.name==='AbortError') return; }
      try{
        const dataUrl=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
        const a=document.createElement('a'); a.href=dataUrl; a.download=fname; a.rel='noopener';
        document.body.appendChild(a); a.click(); a.remove();
        toast('Saved '+fname+' — check your notifications or Downloads'); return;
      }catch(e){}
      try{ window.top.location.href=url; }catch(_){ location.href=url; }
    }catch(e){ try{ window.top.location.href=url; }catch(_){ location.href=url; } }
    finally{ window._glN--; if(g && window._glN<=0) g.classList.remove('show'); }
  })();
}

async function viewHome(){
  shell('<div class="loading">Loading…</div>');

  try{ const n=await api('/api/notifications'); UNREAD=n.unread||0; NOTIFS=n.notifications||[]; }catch(e){}
  const invoiced=invoices.reduce((s,i)=>s+Number(i.total||0),0);
  const outstanding=invoices.reduce((s,i)=>s+Number(i.balance||0),0);
  const paidAmt=Math.max(invoiced-outstanding,0);
  const pct= invoiced? Math.round(paidAmt/invoiced*100) : 0;
  const todayIso=new Date(Date.now()+4*3600*1000).toISOString().slice(0,10);
  const overdue=invoices.filter(i=>Number(i.balance)>0 && (String(i.status).toLowerCase()==='overdue' || (i.due_date && i.due_date<todayIso))).reduce((s,i)=>s+Number(i.balance||0),0);
  const v=SELECTED_VEHICLE||me.vehicle||{};
  const plate=v.plate||'';
  const carName=v.car||v.name||'';
  const carSub=[plate, [v.year,v.color].filter(Boolean).join(' · ')].filter(Boolean).join(' · ');
  // Ownership progress comes from the inventory "% done" for this plate.
  // If the plate isn't found in the inventory, show 0%.
  const barPct= typeof v.percent==='number' ? v.percent : 0;
  const paidLabel= v.months ? `${v.months} MONTHS PAID` : `${barPct}% OWNED`;

// ---------- STATEMENT (from Zoho) ----------
let STMT_RANGE={from:'',to:''};
const dubaiNow=()=>new Date(Date.now()+4*3600*1000);
// Quick-range presets, computed in Dubai time so they match the customer's day.
function stmtPreset(kind){
  const now=dubaiNow(), y=now.getUTCFullYear(), m=now.getUTCMonth();
  const iso=(dt)=>dt.toISOString().slice(0,10), today=iso(now);
  if(kind==='month') return {from:`${y}-${String(m+1).padStart(2,'0')}-01`,to:today};
  if(kind==='3m') return {from:iso(new Date(Date.UTC(y,m-2,1))),to:today};
  if(kind==='year') return {from:`${y}-01-01`,to:today};
  return {from:'',to:''}; // all
}
function activeStmtKind(){
  const r=STMT_RANGE;
  if(!r.from&&!r.to) return 'all';
  for(const k of ['month','3m','year']){ const p=stmtPreset(k); if(p.from===r.from&&p.to===r.to) return k; }
  return 'custom';
}
function stmtPeriodLabel(){
  const {from,to}=STMT_RANGE;
  if(!from&&!to) return 'All transactions';
  if(from&&to) return dmy(from)+' – '+dmy(to);
  return from?('Since '+dmy(from)):('Up to '+dmy(to));
}
async function viewStatement(){
  shell('<div class="loading">Loading…</div>',{title:'Statement',back:true});
  const hasRange=!!(STMT_RANGE.from||STMT_RANGE.to);
  const q=hasRange?('?from='+encodeURIComponent(STMT_RANGE.from||'')+'&to='+encodeURIComponent(STMT_RANGE.to||'')):'';
  const {entries,summary}=await api('/api/statement'+q);
  const due=Number(summary.closing)>0.005;
  const active=activeStmtKind();
  const chip=(k,l)=>`<button class="chip ${active===k?'on':''}" data-k="${k}">${l}</button>`;
  const showOpening=!!STMT_RANGE.from && Math.abs(Number(summary.opening||0))>0.005;
  const cells=[
    showOpening?`<div class="stmt-cell"><div class="k">Opening</div><div class="v">AED ${fmt(summary.opening)}</div></div>`:'',
    `<div class="stmt-cell"><div class="k">Invoiced</div><div class="v">AED ${fmt(summary.invoiced)}</div></div>`,
    `<div class="stmt-cell"><div class="k">Paid</div><div class="v g">AED ${fmt(summary.paid)}</div></div>`,
  ].filter(Boolean).join('');
  const led=entries.map(e=>`<div class="row"><div class="ic" style="color:${e.credit?'var(--green)':'var(--accent)'}">${e.credit?IC.check:IC.doc}</div>
    <div class="m"><div class="r1">${e.label}</div><div class="r2">${dmy(e.date)}</div></div>
    <div class="r"><div class="amt2" style="${e.credit?'color:var(--green)':''}">${e.credit?'− AED '+fmt(e.credit):'AED '+fmt(e.debit)}</div></div></div>`).join('');
  shell(`
    <div class="chips" id="stchips" style="margin-bottom:12px">
      ${chip('all','All')}${chip('month','This month')}${chip('3m','Last 3 months')}${chip('year','This year')}
    </div>
    <div class="drange">
      <div class="datefield${STMT_RANGE.from?' set':''}" id="ff">
        <div class="df-top">${IC.cal}<span class="df-lab">From</span></div>
        <div class="df-val${STMT_RANGE.from?'':' empty'}">${STMT_RANGE.from?dmy(STMT_RANGE.from):'Any date'}</div>
        <input type="date" id="from" max="${STMT_RANGE.to||''}" value="${STMT_RANGE.from||''}">
      </div>
      <div class="datefield${STMT_RANGE.to?' set':''}" id="ft">
        <div class="df-top">${IC.cal}<span class="df-lab">Till</span></div>
        <div class="df-val${STMT_RANGE.to?'':' empty'}">${STMT_RANGE.to?dmy(STMT_RANGE.to):'Any date'}</div>
        <input type="date" id="to" min="${STMT_RANGE.from||''}" value="${STMT_RANGE.to||''}">
      </div>
    </div>
    ${hasRange?'<div style="text-align:right;margin:0 2px 14px"><a id="clr" style="font-size:12px;cursor:pointer">Clear · show all</a></div>':'<div style="height:12px"></div>'}
    <div class="summary">
      <div class="glabel">Closing balance${due?' · due':''}</div>
      <div class="sv ${due?'due':'ok'}">AED ${fmt(summary.closing)}</div>
      <div class="stmt-period">${stmtPeriodLabel()}</div>
      <div class="stmt-grid ${showOpening?'g3':'g2'}">${cells}</div>
    </div>
    <button class="btn btn-ghost" id="dlstmt" style="height:46px;margin-bottom:20px">↓&nbsp; Download statement (PDF)</button>
    <div class="sec-h" style="margin:2px 2px 12px"><span class="glabel">Transactions</span><span class="glabel mut">${entries.length} ${entries.length===1?'entry':'entries'}</span></div>
    <div class="ledger">${entries.length?led:'<div class="loading">No transactions in this period.</div>'}</div>`,{title:'Statement',back:true});
  const applyRange=(from,to)=>{ if(from&&to&&to<from){ const t=from; from=to; to=t; } STMT_RANGE={from:from||'',to:to||''}; go('statement'); };
  app.querySelectorAll('#stchips .chip').forEach(b=>b.onclick=()=>{ STMT_RANGE=stmtPreset(b.dataset.k); go('statement'); });
  const onDate=()=>applyRange(app.querySelector('#from').value,app.querySelector('#to').value);
  ['from','to'].forEach(iid=>{
    const input=document.getElementById(iid);
    input.onchange=onDate;
    // On phones, tapping the (transparent) native input opens the OS date picker
    // on its own. On desktop, nudge the calendar open with showPicker().
    input.onclick=()=>{ try{ if(input.showPicker) input.showPicker(); }catch(e){} };
  });
  const clr=document.getElementById('clr'); if(clr) clr.onclick=()=>{ STMT_RANGE={from:'',to:''}; go('statement'); };
  const ds=document.getElementById('dlstmt'); if(ds) ds.onclick=()=>downloadFile('/api/statement/pdf'+q,'Statement.pdf');
}

  async function refreshSlots(){
    const pdate=app.querySelector('#pdate').value; const note=app.querySelector('#slotnote'); const cells=app.querySelectorAll('#times .tcell');

    if(!plateV){ toast('Please enter the number plate.'); return; }
    if(!phoneV){ toast('Please enter a phone number.'); return; }
    if(!pdate){ toast('Please choose a preferred date.'); return; }

    if(!booking.time){ toast('Please pick a time slot.'); return; }
    if(!desc){ toast('Please describe the work required.'); return; }
    booking.pdate=pdate; booking.desc=desc;
    try{
      await api('/api/bookings',{method:'POST',body:JSON.stringify({car_name:car,plate:plateV,phone:phoneV,service_type:booking.service_type,preferred_date:pdate,time_slot:booking.time,description:desc})});
      showConfirmModal();
    }catch(e){ toast((e&&e.error)||'Could not submit.'); refreshSlots(); }
  };
}

let PAY={amount:'',mode:'',proof:''};
function copyText(t){
  try{
    const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,t.length);
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if(!ok && navigator.clipboard){ navigator.clipboard.writeText(t).catch(()=>{}); }
    toast('Copied to clipboard');
  }catch(e){ try{ navigator.clipboard.writeText(t); toast('Copied'); }catch(_){}} }
function compressImage(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>{
      let w=img.width,h=img.height; const mw=1200; if(w>mw){ h=Math.round(h*mw/w); w=mw; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      let out; try{ out=cv.toDataURL('image/jpeg',0.62); }catch(e){ out=rd.result; }
      cb(out);
    }; img.onerror=()=>cb(rd.result); img.src=rd.result; };
  rd.readAsDataURL(file);
}
async function viewPay(){
  shell('<div class="loading">Loading…</div>',{title:'Make a payment',back:true});
  let invoices=[]; try{ const r=await api('/api/invoices'); invoices=r.invoices||[]; }catch(e){}
  const outstanding=invoices.reduce((s,i)=>s+Number(i.balance||0),0);
  if(PAY.amount===''||Number(PAY.amount)>outstanding) PAY.amount= outstanding? String(outstanding) : '';
  const remaining=Math.max(0, outstanding-(Number(PAY.amount)||0));
  const proofView = PAY.proof ? `<img src="${PAY.proof}">` : `<span class="msym">cloud_upload</span><span class="ut-t">Tap to upload your transfer receipt</span>`;
  shell(`
    <div class="paysum"><div class="glabel">Total amount due</div><div class="sv">AED ${fmt(outstanding)}</div></div>
    <label>Amount to pay</label>
    <div class="amtbox"><span class="cur">AED</span><input id="payamt" type="number" inputmode="decimal" min="1" max="${outstanding}" value="${PAY.amount}" placeholder="0"></div>
    <div class="remain" id="remain">Remaining after this payment: <b>AED ${fmt(remaining)}</b></div>
    <label>Payment method</label>
    <div class="paymethods">
      <button class="pm ${PAY.mode==='card'?'on':''}" data-mode="card"><span class="msym">credit_card</span><span class="pm-m"><span class="pm-t">Card</span><span class="pm-s">Pay securely by card</span></span><span class="chk">${PAY.mode==='card'?'<span class="msym">check</span>':''}</span></button>
      <button class="pm ${PAY.mode==='bank'?'on':''}" data-mode="bank"><span class="msym">account_balance</span><span class="pm-m"><span class="pm-t">Bank transfer</span><span class="pm-s">Transfer &amp; upload your receipt</span></span><span class="chk">${PAY.mode==='bank'?'<span class="msym">check</span>':''}</span></button>
    </div>
    <div class="remain" id="cardfee" style="${PAY.mode==='card'?'':'display:none'}">Includes a 2.5% card fee — total charged: <b>AED <span id="cardtotal">${fmt(Math.round((Number(PAY.amount)||0)*1.025*100)/100)}</span></b></div>
    <div id="banksec" style="${PAY.mode==='bank'?'':'display:none'}">
      <div class="bankbox">
        <div class="glabel mut" style="margin-bottom:8px">Transfer to</div>
        <div class="bankrow"><span class="k">Account title</span><span class="v">Muscle Cars Rent A Car</span></div>
        <div class="bankrow"><span class="k">Bank</span><span class="v">Abu Dhabi Commercial Bank</span></div>
        <div class="bankrow"><span class="k">IBAN</span><button class="v copyv" data-copy="AE280030012811523920001">AE28 0030 0128 1152 3920 001 <span class="msym">content_copy</span></button></div>
        <div class="bankrow"><span class="k">Account no.</span><button class="v copyv" data-copy="12811523920001">12811523920001 <span class="msym">content_copy</span></button></div>
        <div class="bankrow"><span class="k">SWIFT / BIC</span><span class="v">ADCBAEAA</span></div>
      </div>
      <label>Upload transfer proof</label>
      <label class="uploadtile" id="uptile"><input type="file" accept="image/*" id="proffile"><div class="utinner" id="utinner">${proofView}</div></label>
    </div>
    <button class="btn btn-primary" id="paysubmit">Submit payment</button>
  `,{title:'Make a payment',back:true});
  const amt=document.getElementById('payamt'), rem=document.getElementById('remain');
  const updCardTotal=()=>{ const a=Number((document.getElementById('payamt')||{}).value)||0; const ct=document.getElementById('cardtotal'); if(ct) ct.textContent=fmt(Math.round(a*1.025*100)/100); };
  amt.oninput=()=>{ PAY.amount=amt.value; const a=Number(amt.value)||0; rem.innerHTML='Remaining after this payment: <b>AED '+fmt(Math.max(0,outstanding-a))+'</b>'; updCardTotal(); };
  app.querySelectorAll('.pm[data-mode]').forEach(b=>b.onclick=()=>{
    PAY.mode=b.dataset.mode;
    app.querySelectorAll('.pm[data-mode]').forEach(x=>{ x.classList.remove('on'); const ck=x.querySelector('.chk'); if(ck) ck.innerHTML=''; });
    b.classList.add('on'); const ck=b.querySelector('.chk'); if(ck) ck.innerHTML='<span class="msym">check</span>';
    document.getElementById('banksec').style.display = PAY.mode==='bank'?'':'none';
    const cf=document.getElementById('cardfee'); if(cf) cf.style.display = PAY.mode==='card'?'':'none';
    updCardTotal();
  });
  app.querySelectorAll('.copyv').forEach(b=>b.onclick=()=>copyText(b.dataset.copy));
  const pf=document.getElementById('proffile');
  if(pf) pf.onchange=()=>{ const f=pf.files&&pf.files[0]; if(!f) return; compressImage(f,(data)=>{ PAY.proof=data; const ui=document.getElementById('utinner'); if(ui) ui.innerHTML='<img src="'+data+'">'; }); };
  document.getElementById('paysubmit').onclick=async()=>{
    const a=Number(document.getElementById('payamt').value)||0;
    if(a<=0){ toast('Please enter a valid amount.'); return; }
    if(a>outstanding){ toast('Amount cannot exceed the total due.'); return; }
    if(!PAY.mode){ toast('Please choose a payment method.'); return; }
    if(PAY.mode==='card'){ payByCard(a); return; }
    if(PAY.mode==='bank' && !PAY.proof){ toast('Please upload your transfer proof.'); return; }
    try{
      await api('/api/payments',{method:'POST',body:JSON.stringify({amount:a,mode:PAY.mode,proof:PAY.proof})});
      PAY={amount:'',mode:'',proof:''};
      showPayConfirm();
    }catch(e){ toast((e&&e.error)||'Could not submit payment.'); }
  };
}
function showPayConfirm(){
  const ov=$(`<div class="modal-ov"><div class="modal-card">
    <div class="rcheck">${IC.check}</div>
    <div style="font-size:20px;font-weight:800">Payment submitted</div>
    <p style="color:var(--muted);font-size:14px;line-height:1.5;margin:12px 0 22px">Thank you! We've received your payment details and will confirm it shortly.</p>
    <button class="btn btn-primary" id="pok">Done</button></div></div>`);
  document.body.appendChild(ov);
  ov.querySelector('#pok').onclick=()=>{ ov.remove(); go('home'); };
}
// ---- Foloosi card payment (hosted checkout: Apple Pay / Samsung Pay + card) ----
function ensureFoloosi(cb){
  if(window.Foloosipay){ cb(); return; }
  var s=document.createElement('script'); s.src='https://www.foloosi.com/js/foloosipay.v2.js';
  s.onload=function(){ cb(); }; s.onerror=function(){ toast('Could not load the card service. Please try again.'); };
  document.head.appendChild(s);
}
function payByCard(amount){
  toast('Opening secure checkout…');
  ensureFoloosi(function(){
    api('/api/pay/foloosi/init',{method:'POST',body:JSON.stringify({amount:amount})}).then(function(init){
      try{
        // redirect:true -> Foloosi's hosted page (Apple Pay / Samsung Pay / card), returns to /api/pay/foloosi/return
        var fp=new Foloosipay({reference_token:init.reference_token, merchant_key:init.merchant_key, redirect:true});
        fp.open();
      }catch(e){ toast('Could not open the card payment.'); }
    }).catch(function(e){ toast((e&&e.error)||'Could not start the card payment.'); });
  });
}
// After returning from Foloosi's hosted checkout (/portal?paid=...), show the result.
function checkPayReturn(){
  var m=(location.search||'').match(/[?&]paid=(\w+)/);
  if(!m) return;
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  if(m[1]==='success') showCardPayConfirm();
  else if(m[1]==='cancelled') toast('Payment cancelled.');
  else toast('The payment could not be completed. Please try again.');
}
function showCardPayConfirm(){
  const ov=$(`<div class="modal-ov"><div class="modal-card">
    <div class="rcheck">${IC.check}</div>
    <div style="font-size:20px;font-weight:800">Payment successful</div>
    <p style="color:var(--muted);font-size:14px;line-height:1.5;margin:12px 0 22px">Thank you! Your card payment has gone through and will reflect on your account shortly.</p>
    <button class="btn btn-primary" id="cpok">Done</button></div></div>`);
  document.body.appendChild(ov);
  ov.querySelector('#cpok').onclick=()=>{ ov.remove(); if(ME) go('home'); };
}

// ---------- NOTIFICATIONS (bell) ----------
async function openNotifications(){
  let items=NOTIFS;
  try{ const n=await api('/api/notifications'); items=n.notifications||[]; NOTIFS=items; }catch(e){}
  const list = items.length
    ? items.map(n=>`<div class="notif"><div class="notif-t">${n.title?esc(n.title):'Notification'}</div>${n.body?`<div class="notif-b">${esc(n.body)}</div>`:''}<div class="notif-d">${dmy(n.created)}</div></div>`).join('')
    : '<div class="muted center" style="padding:30px 0;font-size:14px">No notifications yet.</div>';
  const ov=$(`<div class="modal-ov"><div class="modal-card" style="text-align:left;max-width:400px;padding:22px 20px">
    <div style="display:flex;align-items:center;justify-content:space-between"><div class="glabel">Notifications</div><button id="nclose" style="background:none;border:none;color:var(--muted);font-size:22px;line-height:1">×</button></div>
    <div style="max-height:62vh;overflow:auto;margin-top:14px">${list}</div>
  </div></div>`);
  document.body.appendChild(ov);
  ov.querySelector('#nclose').onclick=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
  try{ await api('/api/notifications/seen',{method:'POST'}); }catch(e){}
  UNREAD=0; const d=document.querySelector('.iconbtn .dot'); if(d) d.remove();
}

// Tell the V4 app (parent) our sign-in state changed, so its header can show
// the customer's avatar (or revert to "Sign in").
function notifyAuth(){ if(EMBEDDED){ try{ window.parent.postMessage('owncar-auth','*'); }catch(e){} } }

// Lock zoom (iOS Safari ignores user-scalable=no) — block pinch gestures.
['gesturestart','gesturechange','gestureend'].forEach(function(ev){ document.addEventListener(ev,function(e){ e.preventDefault(); },{passive:false}); });

// ---------- BOOT ----------
async function boot(){
  try{ CFG=await api('/api/config'); }catch(e){}
  try{ await api('/api/me'); CURRENT='home'; await viewHome(); notifyAuth(); }
  catch(e){ renderLogin(); }
  checkPayReturn();
}
boot();
</script>
